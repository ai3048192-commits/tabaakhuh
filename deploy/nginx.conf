# Tabaakhuh admin dashboard — nginx vhost for the static `dist/` bundle.
#
#   npm run build                 # cross-origin API (VITE_API_BASE_URL absolute)
#   npm run build:same-origin     # API proxied under /api on this same host
#
# Copy dist/ to /var/www/tabaakhuh, then adapt server_name and the TLS paths.

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    root  /var/www/tabaakhuh;
    index index.html;

    # A <meta> CSP cannot express frame-ancestors, so clickjacking protection
    # has to come from here (see the note in vite.config.ts).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Content-hashed filenames: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy keeps serving the old
    # bundle's asset URLs, which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API deployments only — drop this block when the dashboard
    # talks to an absolute API origin baked in at build time.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # React Router owns every other path: hand them all index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
