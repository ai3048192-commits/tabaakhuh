name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # Proves the production build works end to end, including the
      # build-time CSP guard in vite.config.ts. The URL is a placeholder: the
      # real deploy passes its own, and nothing here is published.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
